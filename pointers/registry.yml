pointers:
  - id: PTR-START-001
    intent: consult the current official Letta documentation index
    prerequisites: []
    target_type: official-docs
    target: https://docs.letta.com/
    authority_class: official-product-docs
    freshness: medium
    requirement: stage-gated
    owner_module: MOD-00
    expected_takeaway: Locate the canonical current page for a volatile Letta fact before relying on it.
    unavailable_behavior: Continue only with stable local method and mark the product fact unavailable or stale.
    non_authority: Documentation access does not authorize commands, agents, credentials, paid use, or runtime claims.
    grants_authority: false
