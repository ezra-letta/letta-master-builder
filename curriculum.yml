target_contract:
  primary_persona: technically-proficient-coding-agent
  domain_baseline: zero-prior-letta-knowledge
  language: en
  teaching_mode: read-only
  implementation_language: TypeScript
  mandatory_path: agent-sdk
  primary_runtime_lane: agent-sdk-node-local
  contrast_runtime_lane: agent-sdk-node-cloud
  direct_app_server: awareness
  remote_client: awareness
  agent_foundry: conceptual-only
  evidence_cutoff_semantics: latest-exactly-verified-at-release-cutoff
  side_effects: forbidden-without-separate-explicit-authorization
  word_budget: {mandatory_prose_min: 70000, mandatory_prose_max: 74000, current_prose: 70891, complete: true}
  completion: true
  runtime_claims: false
  autonomous_execution: false
