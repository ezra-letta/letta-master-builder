name: Network evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate local control plane before network access
        run: |
          npm test
          npm run validate
          npm run lock:check
          npm run integrity:check
      - name: Verify package and immutable tag evidence
        run: npm run check:packages
      - name: Verify source-registry external links
        run: npm run check:links
