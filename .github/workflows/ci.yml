name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run vertical-slice:install
      - name: Verify complete offline release-candidate gate set
        run: npm run release:check

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test .security/audit-exceptions.test.mjs
      - name: Enforce root dependency audit policy
        run: |
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT
          set +e
          npm audit --json --package-lock-only > "$audit_file"
          audit_rc=$?
          set -e
          if [ "$audit_rc" -ne 0 ] && [ "$audit_rc" -ne 1 ]; then
            echo "root npm audit failed before producing an evaluable finding set" >&2
            exit "$audit_rc"
          fi
          node .security/check-audit-exceptions.mjs root package-lock.json < "$audit_file"
      - name: Enforce vertical-slice publication block
        run: |
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT
          set +e
          npm audit --json --package-lock-only --prefix vertical-slice > "$audit_file"
          audit_rc=$?
          set -e
          if [ "$audit_rc" -ne 0 ] && [ "$audit_rc" -ne 1 ]; then
            echo "vertical-slice npm audit failed before producing an evaluable finding set" >&2
            exit "$audit_rc"
          fi
          node .security/check-audit-exceptions.mjs vertical-slice vertical-slice/package-lock.json < "$audit_file"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false
